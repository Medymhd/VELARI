<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Theme palettes mirror packages/ui/styles.css. The active theme is set
         on <html data-theme="…"> by the loader script below (reads the same
         localStorage the main window writes; same origin = shared). */
      :root, [data-theme="ocean"] {
        --accent: #4d8dff;
        --accent-2: #22d3ee;
        --accent-rgb: 77, 141, 255;
        --glass: rgba(14, 20, 31, 0.86);
      }
      [data-theme="violet"] {
        --accent: #7c7cff;
        --accent-2: #a06bff;
        --accent-rgb: 124, 124, 255;
        --glass: rgba(16, 17, 22, 0.86);
      }
      [data-theme="midnight"] {
        --accent: #5e8bd9;
        --accent-2: #8fb8f0;
        --accent-rgb: 94, 139, 217;
        --glass: rgba(13, 18, 32, 0.86);
      }
      :root {
        --border: rgba(255, 255, 255, 0.08);
        --text: #e9ebf0;
        --muted: #8f94a3;
        --success: #34d399;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Inter, system-ui, "Segoe UI", sans-serif; }
      .panel {
        height: 100%; display: flex; flex-direction: column; gap: 10px;
        padding: 12px 14px; border-radius: var(--radius);
        background: var(--glass); border: 1px solid var(--border);
        backdrop-filter: blur(18px); box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        color: var(--text); -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex; align-items: center; gap: 8px; cursor: grab;
        padding-bottom: 8px; border-bottom: 1px solid var(--border);
      }
      header b { font-size: 13px; letter-spacing: 0.02em; }
      header .spacer { flex: 1; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px rgba(52, 211, 153, 0.6); }
      .btn {
        font: inherit; font-size: 11px; cursor: pointer; border-radius: 8px;
        border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06); color: var(--text);
        padding: 4px 10px;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.12); }
      .btn.on { background: var(--accent); border-color: transparent; color: #fff; }
      .sec { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
      .sec label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .q { font-size: 15px; font-weight: 600; line-height: 1.35; }
      .outline { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; color: var(--text); }
      .points { font-size: 13px; line-height: 1.5; color: var(--muted); }
      .resp-kind { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
      .resp-q { font-size: 16px; font-weight: 650; line-height: 1.35; }
      .chip {
        display: inline-block; margin-top: 4px; font-size: 11px; padding: 1px 8px; border-radius: 999px;
        border: 1px solid rgba(251, 191, 36, 0.45); color: #fbbf24;
      }
      .resp-body { font-size: 14.5px; line-height: 1.5; color: var(--text); margin-top: 5px; }
      .resp-body ol { margin: 0; padding-left: 18px; }
      .resp-points { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
      /* Crimson-tinted "extra info" block: CV-grounded instance the user may
         or may not need — clearly secondary to the direct answer above. */
      .grounding {
        margin-top: 8px; padding: 7px 10px; border-radius: 8px;
        background: rgba(220, 20, 60, 0.08); border-left: 2px solid rgba(220, 20, 60, 0.45);
        font-size: 12.5px; line-height: 1.5; color: #b5566a;
      }
      .resp-empty { color: var(--muted); font-size: 12.5px; padding: 6px 2px; }
      /* Single-line interviewer strip — the current question, full width.
         The old 8-line transcript churned truncated fragments ("IVWhat"). */
      .qstrip {
        font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--text);
        border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
        background: rgba(0, 0, 0, 0.25);
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .qstrip.empty { color: var(--muted); font-weight: 400; font-size: 12.5px; }
      /* Written ask — type or paste a question / direction for the coach.
         Collapsed by default (stealth first); ⌘/Ctrl+K or the ✎ button opens. */
      .ask-row { display: flex; gap: 6px; align-items: flex-start; }
      .ask-row textarea {
        flex: 1; font: inherit; font-size: 12.5px; line-height: 1.4; color: var(--text);
        background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 8px;
        padding: 7px 9px; resize: none; outline: none;
      }
      .ask-row textarea:focus { border-color: var(--accent); }
      .ask-row .btn { flex: none; padding: 6px 10px; }
      .ask-mode { display: flex; flex-direction: column; gap: 4px; flex: none; }
      .ask-mode .mode-btn { padding: 3px 8px; font-size: 10.5px; opacity: 0.75; }
      .ask-mode .mode-btn.on { background: var(--accent); border-color: transparent; color: #fff; opacity: 1; }
      .muted { color: var(--muted); }
      .small { font-size: 11px; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 3px; }
      .resp-stack { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 84px; }
      .resp-card {
        border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
        background: rgba(124, 124, 255, 0.07);
      }
      /* Ring system: green = newest response, yellow = low STT confidence
         (question may be misheard), blue = older responses. */
      .resp-card.newest { border: 2px solid #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.25); }
      .resp-card.lowconf { border: 2px solid #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.22); }
      .resp-card.lowconf.newest { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.25); }
      .resp-card.older { border: 1px solid rgba(124, 124, 255, 0.45); }
      .resp-as { font-size: 10px; color: var(--muted); margin-top: 4px; font-style: italic; }
      .chip.cached { border-color: rgba(52, 211, 153, 0.45); color: #34d399; }
      .chip.offline { border-color: rgba(248, 113, 113, 0.45); color: #f87171; }
      .resp-kind { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
      .resp-q { font-size: 13px; font-weight: 600; line-height: 1.35; }
      .chip {
        display: inline-block; margin-top: 4px; font-size: 10px; padding: 1px 7px; border-radius: 999px;
        border: 1px solid rgba(251, 191, 36, 0.45); color: #fbbf24;
      }
      .resp-body { font-size: 11.5px; line-height: 1.45; color: var(--text); margin-top: 4px; }
      .resp-body ol { margin: 0; padding-left: 16px; }
      .resp-points { color: var(--muted); margin-top: 3px; }
      .resp-empty { color: var(--muted); font-size: 11.5px; padding: 6px 2px; }
      .insight-arrive { animation: respIn 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes respIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
      .resp-as { font-size: 10px; color: var(--muted); margin-top: 4px; font-style: italic; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 3px; }
      /* Extraordinary HUD — scan lines, waveform, timing, confidence */
      .panel.hud { position: relative; overflow: hidden; }
      .panel.hud::after {
        content: ""; position: absolute; inset: 0;
        background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(var(--accent-rgb), 0.04) 2px 3px);
        pointer-events: none; animation: scanDrift 8s linear infinite;
      }
      @keyframes scanDrift { from { transform: translateY(0); } to { transform: translateY(3px); } }
      .waveform { display: flex; align-items: center; gap: 2px; height: 16px; }
      .waveform span { width: 3px; height: 6px; background: var(--accent); border-radius: 2px; animation: wave 0.8s ease-in-out infinite; }
      .waveform span:nth-child(2) { animation-delay: 0.1s; height: 10px; }
      .waveform span:nth-child(3) { animation-delay: 0.2s; height: 14px; }
      .waveform span:nth-child(4) { animation-delay: 0.15s; height: 9px; }
      .waveform span:nth-child(5) { animation-delay: 0.05s; height: 12px; }
      @keyframes wave { 0%,100% { height: 6px; opacity: 0.6; } 50% { height: 16px; opacity: 1; } }
      .timing-bar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; margin-top: 4px; }
      .timing-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 2px; transition: width 0.4s cubic-bezier(0.16,1,0.3,1); }
      .confidence-meter { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 4px; }
      .confidence-meter > div { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
      .confidence-meter.high > div { background: #34d399; }
      .confidence-meter.med > div { background: #fbbf24; }
      .confidence-meter.low > div { background: #f87171; }
    </style>
  </head>
  <body>
    <div class="panel hud">
      <header data-tauri-drag-region>
        <span class="dot"></span><b>Live coach</b>
        <div class="waveform" id="wave" style="margin-left: 8px; display: none;"><span></span><span></span><span></span><span></span><span></span></div>
        <span class="spacer" data-tauri-drag-region></span>
        <button class="btn" id="hideBtn" title="Hide">✕</button>
      </header>
      <div class="timing-bar"><div id="timingFill" style="width: 0%"></div></div>
      <section class="sec" style="flex: 1;">
        <label>Responses — newest first</label>
        <div id="responses" class="resp-stack">
          <div class="resp-empty">Listening — coach answers will stack here, latest on top.</div>
        </div>
      </section>
      <section class="sec">
        <label>Interviewer</label>
        <div id="qstrip" class="qstrip empty">Listening for the interviewer…</div>
      </section>
      <section class="sec" id="askSec" style="display:none">
        <div class="ask-row">
          <div class="ask-mode">
            <button class="btn mode-btn on" id="askModeBtn" title="Ask = interview coach pipeline (cache, prep, draft). Ctrl+Enter sends.">Ask</button>
            <button class="btn mode-btn" id="solveModeBtn" title="Solve = send the prompt straight to the LLM — evaluate, analyze, compare, draft. Ctrl+Enter or Enter sends.">Solve</button>
          </div>
          <textarea id="askInput" rows="2" placeholder="Ask the coach — paste a question or a direction… (Enter to send, Shift+Enter for a new line)"></textarea>
          <button class="btn" id="askSendBtn" title="Send (Enter)">Ask ↵</button>
        </div>
        <span class="small muted" id="askStatus" style="display:none"></span>
      </section>
    </div>
    <script>
      // Theme loader — runs before the main script. Same-origin localStorage
      // is shared with the main window, so the persisted palette applies at
      // overlay open; the theme://changed event restyles live on switch.
      (function () {
        const apply = () => {
          try {
            const t = localStorage.getItem("velari_theme") || "ocean";
            document.documentElement.dataset.theme = t;
          } catch { /* localStorage unavailable — default palette */ }
        };
        apply();
      })();
    </script>
    <script>
      if (!window.__TAURI__) {
        // Never leave the overlay silently dead — say what's wrong.
        const stack = document.getElementById("responses");
        if (stack) {
          stack.textContent = "Overlay unavailable: Tauri API failed to load — restart the app.";
          stack.style.border = "1px solid #f87171";
        }
      } else {
      const { invoke, event } = window.__TAURI__;
      const $ = (id) => document.getElementById(id);

      // Live theme switch: the Settings screen forwards the new palette here.
      event.listen("theme://changed", (e) => {
        try {
          const t = String(e.payload?.theme ?? "ocean");
          document.documentElement.dataset.theme = t;
        } catch { /* keep current palette */ }
      });

      // EVENT LISTENERS FIRST — they must attach before anything else in this
      // block can throw. (A speak-button listener on a removed element used to
      // kill the script here and leave the overlay permanently deaf.)
      let lastInsight = null;

      // Interviewer strip: track the CURRENT question, not a fragment churn.
      // Finals append; a question final replaces the strip in place; back-
      // channel short lines never overwrite a real question.
      let currentQuestion = "";
      event.listen("overlay://transcript", (e) => {
        try {
        const { speaker, text, isFinal } = e.payload;
        setWave(!isFinal);
        if (!isFinal) return;
        const t = String(text ?? "").trim();
        if (!t) return;
        const isUser = speaker === "user";
        if (isUser) return; // only the interviewer side is shown
        const looksQuestion = t.includes("?") || /^(tell|what|how|why|when|walk|describe|explain|give|can you|could you|do you|have you)\b/i.test(t);
        const backchannel = t.split(/\s+/).length <= 2 && !t.includes("?");
        if (looksQuestion || (!currentQuestion && !backchannel)) {
          currentQuestion = t;
          const strip = $("qstrip");
          strip.textContent = t;
          strip.classList.remove("empty");
          strip.classList.toggle("empty", false);
        }
        setTimeout(() => setWave(false), 800);
        } catch (err) {
          console.error("transcript render failed", err);
        }
      });

      event.listen("overlay://insight", (e) => {
        try {
        const c = e.payload.contentJson ?? {};
        // Answer-first stack: the speakable answer (drafted/prepared/cached)
        // ALWAYS lives at the top in green; coach framework cards slot
        // beneath it when they arrive a beat later. Newest card of its kind
        // still gets placement priority within its zone.
        const stack = $("responses");
        const empty = stack.querySelector(".resp-empty");
        if (empty) empty.remove();
        const isSolve = e.payload.type === "solver";
        const isAnswer = isSolve || e.payload.type === "auto_answer" || e.payload.type === "prepared_answer" || Boolean(c.answer && !c.detected_question);
        const isPrepared = e.payload.type === "prepared_answer";
        const card = document.createElement("div");
        card.className = "resp-card insight-arrive";
        const lowConf = typeof c.stt_confidence === "number" && c.stt_confidence < 0.7;
        if (lowConf) card.classList.add("lowconf");
        const badge = document.createElement("div");
        badge.className = "resp-kind";
        badge.textContent = isSolve ? "Solved" : isPrepared ? "Prepared answer" : isAnswer ? "Drafted answer" : "Coach";
        card.appendChild(badge);
        const q = document.createElement("div");
        q.className = "resp-q";
        q.textContent = isSolve
          ? (c.question || "Your prompt")
          : (c.detected_question || c.question || (isPrepared ? String(c.title ?? "") : "Auto-drafted answer"));
        card.appendChild(q);
        if (lowConf) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = "low confidence — verify";
          card.appendChild(chip);
        }
        if (c.offline === true) {
          const chip = document.createElement("span");
          chip.className = "chip offline";
          chip.textContent = isSolve ? "LLM unavailable" : "scaffold — LLM unavailable";
          card.appendChild(chip);
        }
        if (c.cached === true) {
          const chip = document.createElement("span");
          chip.className = "chip cached";
          chip.textContent = "cached";
          card.appendChild(chip);
        }
        if (c.offline === true) {
          const chip = document.createElement("span");
          chip.className = "chip offline";
          chip.textContent = isSolve ? "LLM unavailable" : "scaffold — LLM unavailable";
          card.appendChild(chip);
        }
        const body = document.createElement("div");
        body.className = "resp-body";
        if (isSolve) {
          // Solver results keep their line breaks — pasted prompts often ask
          // for structured output (lists, steps, tables of pros/cons).
          body.style.whiteSpace = "pre-wrap";
          body.textContent = c.answer ?? "";
        } else if (isAnswer || isPrepared) {
          body.textContent = c.answer ?? "";
          // Crimson "extra info" block: optional CV-grounded instance —
          // annotation, not part of the rehearsed answer.
          if (typeof c.grounding === "string" && c.grounding.trim()) {
            const g = document.createElement("div");
            g.className = "grounding";
            g.textContent = c.grounding;
            body.appendChild(g);
          }
        } else {
          const ol = document.createElement("ol");
          for (const item of (c.suggested_outline ?? []).slice(0, 4)) {
            const li = document.createElement("li");
            li.textContent = item;
            ol.appendChild(li);
          }
          body.appendChild(ol);
          const pts = document.createElement("div");
          pts.className = "resp-points";
          pts.textContent = (c.talking_points ?? []).join(" · ");
          body.appendChild(pts);
        }
        card.appendChild(body);
        if (c.cached === true && typeof c.cached_question === "string" && c.cached_question) {
          const as = document.createElement("div");
          as.className = "resp-as";
          as.textContent = "answered as: " + c.cached_question;
          card.appendChild(as);
        }
        // Zone insertion: drafted > prepared > coach framework. The LATEST
        // drafted answer always goes to the very top (index 0) — the previous
        // top card slides down and the green ring follows the new answer.
        // (insertBefore(card, null) appends — that pinned the first answer on
        // top forever whenever no prepared/framework card existed yet.)
        const firstFramework = [...stack.children].find((el) => el.dataset?.zone === "framework");
        card.dataset.zone = isPrepared ? "prepared" : isAnswer ? "answer" : "framework";
        card.__content = c;
        const frameworkCards = [...stack.children].filter((el) => el.dataset?.zone === "framework");
        if (isAnswer && !isPrepared) {
          stack.insertBefore(card, stack.firstElementChild); // absolute top — latest answer leads
        } else if (isPrepared) {
          stack.insertBefore(card, frameworkCards[0] ?? null); // under drafted answers, above frameworks
        } else {
          stack.insertBefore(card, firstFramework ?? null); // head of framework zone
        }
        while (stack.childElementCount > 3) {
          // Never drop the card we just inserted — trim the oldest sibling.
          const victim = stack.lastElementChild === card ? card.previousElementSibling : stack.lastElementChild;
          if (victim) stack.removeChild(victim); else break;
        }
        // Ring ranking: newest overall card is green, the rest blue/yellow —
        // with answer-first insertion, that is the speakable answer 95% of
        // the time.
        stack.querySelectorAll(".resp-card").forEach((n, idx) => {
          n.classList.toggle("newest", idx === 0);
          n.classList.toggle("older", idx !== 0);
        });
        // Speak reads the topmost (green) card's content.
        lastInsight = stack.children[0]?.__content ?? c;
        pulseTiming();
        setWave(false);
        } catch (err) {
          // One malformed payload must never wedge the stack for the session —
          // log and keep listening.
          console.error("insight render failed", err);
        }
      });

      // Announce readiness — the app-level forwarder backfills the current
      // session tail (recent transcript + latest response) on open.
      event.emit("overlay://ready", {});

      // Re-assert typing mode on re-show: window re-show resets passthrough to
      // SMART in Rust, and the ask box may still be open from before — sync
      // the ex-style with the visible ask-box state on every re-show.
      event.listen("overlay://visibility", (e) => {
        if (e.payload === true) {
          const sec = $("askSec");
          if (sec && sec.style.display !== "none") toggleAsk(true);
        }
      });

      $("hideBtn").addEventListener("click", async () => {
        try {
          await invoke("overlay_hide", { verticalId: "interview-intelligence" });
        } catch (e) {
          console.error("hide failed", e);
        }
      });

      // ── Written ask: type/paste a question or a direction for the coach,
      // or flip to SOLVE and send a prompt straight to the LLM (evaluate,
      // analyze, compare, draft — answered as-is).
      // Enter sends; Shift+Enter inserts a newline; Escape closes the box.
      let askMode = "ask"; // "ask" | "solve"
      function setAskMode(mode) {
        askMode = mode;
        const ask = $("askModeBtn"), solve = $("solveModeBtn");
        if (ask) ask.classList.toggle("on", mode === "ask");
        if (solve) solve.classList.toggle("on", mode === "solve");
        const input = $("askInput");
        if (input) input.placeholder = mode === "solve"
          ? "Solve — evaluate, analyze, summarize, draft… (Enter to send)"
          : "Ask the coach — paste a question or a direction… (Enter to send, Shift+Enter for a new line)";
        const send = $("askSendBtn");
        if (send) send.textContent = mode === "solve" ? "Solve ↵" : "Ask ↵";
      }
      function sendAsk() {
        const input = $("askInput");
        const status = $("askStatus");
        const text = (input?.value ?? "").trim();
        if (!text) return;
        try {
          // overlay://user_ask → main window listener (LiveSession) → WS
          // coach.ask (full coach pipeline) or coach.solve (direct LLM).
          event.emit("overlay://user_ask", { text, mode: askMode });
          if (input) input.value = "";
          if (status) {
            status.textContent = askMode === "solve"
              ? "Sent to AI — result will appear above."
              : "Sent to coach — answer will appear above.";
            status.style.display = "block";
            setTimeout(() => { if (status) status.style.display = "none"; }, 4000);
          }
        } catch (e) {
          if (status) {
            status.textContent = "Send failed — is the app running?";
            status.style.display = "block";
          }
        }
      }
      $("askSendBtn")?.addEventListener("click", sendAsk);
      $("askInput")?.addEventListener("keydown", (e) => {
        // Enter sends; Shift+Enter is a plain newline (default behavior).
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendAsk();
        }
        if (e.key === "Escape") {
          e.preventDefault();
          toggleAsk(false);
        }
      });
      $("askModeBtn")?.addEventListener("click", () => setAskMode("ask"));
      $("solveModeBtn")?.addEventListener("click", () => setAskMode("solve"));
      // Global shortcut (while overlay focused): Ctrl/Cmd+K toggles the ask box.
      window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          toggleAsk();
        }
      });
      function toggleAsk(force) {
        const sec = $("askSec");
        if (!sec) return;
        const show = force !== undefined ? force : sec.style.display === "none";
        sec.style.display = show ? "flex" : "none";
        // Typing mode: lift smart passthrough + WS_EX_NOACTIVATE while the
        // ask box is open — otherwise the bottom half of the window is
        // click-through (textarea/buttons dead) and can't take keystrokes.
        try {
          const label = window.__TAURI__.window.getCurrentWindow().label;
          const verticalId = label.startsWith("overlay:") ? label.slice(8) : "interview-intelligence";
          void invoke("overlay_set_typing", { verticalId, enabled: show });
        } catch { /* label unavailable */ }
        if (show) {
          setTimeout(() => $("askInput")?.focus(), 30);
        } else {
          reportHeight();
        }
      }
      // Start collapsed but let the ✎ button open it. Add the toggle button
      // to the header next to the hide button.
      const askToggle = document.createElement("button");
      askToggle.className = "btn";
      askToggle.id = "askToggleBtn";
      askToggle.title = "Ask the coach (Ctrl+K)";
      askToggle.textContent = "✎";
      $("hideBtn")?.parentElement?.insertBefore(askToggle, $("hideBtn"));
      askToggle.addEventListener("click", () => toggleAsk());
      // Height re-report when the ask box opens (ResizeObserver covers content growth).
      new MutationObserver(() => reportHeight()).observe($("askSec") ?? document.body, { attributes: true, attributeFilter: ["style"] });

      // Auto-height (reference parity): report panel height so the window fits content.
      function reportHeight() {
        try {
          const label = window.__TAURI__.window.getCurrentWindow().label;
          const verticalId = label.startsWith("overlay:") ? label.slice(8) : "interview-intelligence";
          const h = document.querySelector(".panel")?.getBoundingClientRect().height ?? 430;
          void window.__TAURI__.core.invoke("overlay_resize", { verticalId, height: Math.ceil(h) });
        } catch { /* label unavailable */ }
      }
      const resizeObs = new ResizeObserver(() => reportHeight());
      window.addEventListener("DOMContentLoaded", () => {
        const panel = document.querySelector(".panel");
        if (panel) resizeObs.observe(panel);
        reportHeight();
      });
      function setWave(active) { const w = $("wave"); if (w) w.style.display = active ? "flex" : "none"; }
      function pulseTiming() {
        const t = $("timingFill");
        if (!t) return;
        t.style.width = "0%";
        requestAnimationFrame(() => { t.style.width = "100%"; });
        setTimeout(() => { t.style.width = "0%"; }, 3000);
      }

      // Speak reads the newest card aloud: question, then the answer/points.
      // Drafted answers speak the direct answer ONLY — the crimson grounding
      // block is optional extra, not something to rehearse.
      // Guarded — the button is optional chrome; a missing element must never
      // kill this script (that class of crash left the overlay deaf once).
      let speakText = "";
      $("speakBtn")?.addEventListener("click", async () => {
        if (!lastInsight) return;
        const parts = [];
        if (lastInsight.answer) {
          if (lastInsight.question) parts.push(lastInsight.question);
          parts.push(lastInsight.answer);
        } else {
          if (lastInsight.detected_question) parts.push(lastInsight.detected_question);
          if (lastInsight.suggested_outline?.length) parts.push(lastInsight.suggested_outline.join(". "));
          if (lastInsight.talking_points?.length) parts.push(lastInsight.talking_points.join(". "));
        }
        speakText = parts.join(". ");
        if (!speakText) return;

        // Try Piper (premium local voice) → fallback to Web Speech API.
        try {
          const b64 = await invoke("tts_speak", { text: speakText });
          playWav(b64);
        } catch {
          webSpeak(speakText);
        }
      });

      function webSpeak(text) {
        try {
          speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.rate = 1.1;
          utter.pitch = 1;
          speechSynthesis.speak(utter);
        } catch { /* no voices available */ }
      }

      function playWav(b64) {
        try {
          const bin = atob(b64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const blob = new Blob([bytes], { type: "audio/wav" });
          const audio = new Audio(URL.createObjectURL(blob));
          audio.play();
        } catch { webSpeak(speakText); }
      }
      }
    </script>
  </body>
</html>
